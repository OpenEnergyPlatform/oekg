name: gh-pages

# Adapted from OpenEnergyPlatform/academy's gh-pages.yml (academy's local mkdocs plugin
# step stripped, requirements file renamed).
#
# NOTE: the trigger branch is `production` — this repository's DEFAULT BRANCH.
# It is NOT `main` and NOT `develop`. A family workflow copied without adjusting this
# silently never fires; that bug is live in municipal-heat-planning-ontology today.
on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: write # required: gh-deploy pushes the gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - uses: actions/cache@v4
        with:
          key: ${{ github.ref }}
          path: .cache
      - run: pip install --upgrade -r requirements-docs.txt
      - run: mkdocs gh-deploy --force
